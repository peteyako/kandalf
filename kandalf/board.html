<title>Plans Board</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>

* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* #board's display:flex would otherwise win over hidden */
html, body { height: 100%; margin: 0; }

/* ---------- Classic: the board's original look, and its dark mode ---------- */
:root[data-theme="classic"] {
  --bg: #f4f5f7; --col: #ebecf0; --card: #ffffff; --text: #172b4d; --muted: #5e6c84;
  --line: #dfe1e6; --accent: #0c66e4; --accent-soft: #e9f2ff; --done: #1f845a; --warn: #c9372c; --warn-soft: #ffeceb;
  --shadow: 0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31);
  --code: #f1f2f4; --story: #22a06b; --p2: #c25100; --p3: #946f00; --yellow: #f5cd47;
  --purple: #6e5dc6; --magenta: #ae2e8a; --teal: #1d7f8c;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="classic"] {
    --bg: #1d2125; --col: #161a1d; --card: #22272b; --text: #b6c2cf; --muted: #8c9bab;
    --line: #2c333a; --accent: #579dff; --accent-soft: #1c2b41; --done: #4bce97; --warn: #f87168; --warn-soft: #42221f;
    --shadow: 0 1px 1px rgba(0,0,0,.5), 0 0 1px rgba(0,0,0,.5);
    --code: #2c333a; --story: #4bce97; --p2: #fea362; --p3: #e2b203; --yellow: #e2b203;
    --purple: #9f8fef; --magenta: #e774bb; --teal: #6cc3e0;
  }
}
:root[data-theme="classic"] body { background: var(--bg); color: var(--text); font: 14px/1.42 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
:root[data-theme="classic"] header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
/* A fixed width, so the board buttons beside the title stay put from page to page; a longer title (a plan doc's) is cut short, in full on hover. */
:root[data-theme="classic"] #storeName { font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
:root[data-theme="classic"] #storeName:empty { display: none; }
:root[data-theme="classic"] header h1 { font-size: 18px; margin: 0 12px 0 0; flex: 0 0 9em; width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:root[data-theme="classic"] select, :root[data-theme="classic"] button, :root[data-theme="classic"] input, :root[data-theme="classic"] textarea { font: inherit; color: inherit; }
:root[data-theme="classic"] select, :root[data-theme="classic"] input[type=text] { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
:root[data-theme="classic"] button { background: var(--col); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
:root[data-theme="classic"] button:hover { filter: brightness(.95); }
:root[data-theme="classic"] button.primary { background: var(--accent); color: #fff; }
:root[data-theme="classic"] button.danger { color: var(--warn); }
:root[data-theme="classic"] #status { margin-left: auto; color: var(--muted); font-size: 12px; }
:root[data-theme="classic"] #status.err { color: var(--warn); }
:root[data-theme="classic"] #search { width: 200px; }
:root[data-theme="classic"] #fileSel { display: flex; gap: 4px; flex-wrap: wrap; }
:root[data-theme="classic"] #fileSel button { background: transparent; border: 1px solid var(--line); color: var(--muted); }
:root[data-theme="classic"] #fileSel button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="classic"] #board { flex: 1; display: flex; gap: 12px; padding: 16px 20px; overflow-x: auto; align-items: flex-start; }
:root[data-theme="classic"] .column { --colc: var(--line); flex: 1 1 280px; min-width: 280px; background: color-mix(in srgb, var(--colc) 7%, var(--col)); border-top: 3px solid var(--colc); border-radius: 6px; display: flex; flex-direction: column; max-height: 100%; }
:root[data-theme="classic"] .column.dragging { opacity: .4; }
/* Column colours, by name (columns and the move zones beside Archive): an unnamed status keeps the neutral --line edge. */
:root[data-theme="classic"] [data-kind="backlog"] { --colc: var(--muted); }
:root[data-theme="classic"] [data-kind="bugs"] { --colc: var(--warn); }
:root[data-theme="classic"] [data-kind="to-do"] { --colc: var(--yellow); }
:root[data-theme="classic"] [data-kind="in-flight"] { --colc: var(--accent); }
:root[data-theme="classic"] [data-kind="done"] { --colc: var(--done); }
/* The backlog board's kinds of work. */
:root[data-theme="classic"] [data-kind="design-decision"] { --colc: var(--purple); }
:root[data-theme="classic"] [data-kind="major-feature"] { --colc: var(--magenta); }
:root[data-theme="classic"] [data-kind="feature"] { --colc: var(--accent); }
:root[data-theme="classic"] [data-kind="change"] { --colc: var(--teal); }
/* A coloured column names itself in its colour; any other column keeps the muted name. */
:root[data-theme="classic"] .column { --colt: var(--muted); }
:root[data-theme="classic"] .column:is([data-kind="backlog"], [data-kind="bugs"], [data-kind="in-flight"], [data-kind="done"],
  [data-kind="design-decision"], [data-kind="major-feature"], [data-kind="feature"], [data-kind="change"]) { --colt: var(--colc); }
:root[data-theme="classic"] .column[data-kind="to-do"] { --colt: var(--p3); }  /* bright yellow text is unreadable on the light column */
:root[data-theme="classic"] .column .col-name { color: var(--colt); }
:root[data-theme="classic"] .col-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 12px; cursor: grab; }
:root[data-theme="classic"] .col-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:root[data-theme="classic"] .col-count { font-size: 12px; color: var(--muted); }
:root[data-theme="classic"] .col-head button { padding: 2px 6px; background: transparent; color: var(--muted); }
:root[data-theme="classic"] .col-head .col-clear { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
:root[data-theme="classic"] .col-head .col-clear:hover { color: var(--accent); }
:root[data-theme="classic"] .col-intro { margin: 0 12px 6px; font-size: 12px; color: var(--muted); }
:root[data-theme="classic"] .col-intro summary { cursor: pointer; }
/* Why pickup is off: one muted line at the top of In flight, with a × that hides it. */
:root[data-theme="classic"] .pickup-why { display: flex; align-items: flex-start; gap: 6px; margin: 0 12px 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
:root[data-theme="classic"] .pickup-why span { flex: 1; }
:root[data-theme="classic"] .pickup-why button { padding: 0 4px; background: transparent; color: var(--muted); line-height: 1.42; }
:root[data-theme="classic"] .col-intro div { white-space: pre-wrap; margin-top: 4px; max-height: 160px; overflow: auto; }
:root[data-theme="classic"] .cards { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 40px; overflow-y: auto; }
:root[data-theme="classic"] .card { background: var(--card); border-radius: 4px; box-shadow: var(--shadow); padding: 8px 10px; cursor: pointer; user-select: none; overflow-wrap: anywhere; }
:root[data-theme="classic"] .card:hover { background: var(--accent-soft); }
:root[data-theme="classic"] .card.dragging { opacity: .35; }
:root[data-theme="classic"] .card .title { font-weight: 600; }
:root[data-theme="classic"] .card .desc { color: var(--muted); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
:root[data-theme="classic"] .card .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
:root[data-theme="classic"] .card.done .title { text-decoration: line-through; color: var(--muted); }
:root[data-theme="classic"] .check { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
:root[data-theme="classic"] .check.on { background: var(--done); border-color: var(--done); color: #fff; }
:root[data-theme="classic"] .key { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
:root[data-theme="classic"] .card.done .key { text-decoration: line-through; }
:root[data-theme="classic"] .prio { font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 3px; white-space: nowrap; color: var(--p); background: color-mix(in srgb, var(--p) 14%, transparent); }
:root[data-theme="classic"] .est { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
:root[data-theme="classic"] .linked { display: inline-flex; align-items: center; color: var(--accent); cursor: help; }
:root[data-theme="classic"] .linked svg { width: 12px; height: 12px; }
:root[data-theme="classic"] .model { font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--muted); }
:root[data-theme="classic"] .repos-pick { display: inline-flex; align-items: center; gap: 6px; }
:root[data-theme="classic"] .repos-pick label { display: inline-flex; align-items: center; gap: 3px; }
:root[data-theme="classic"] .repos { font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--muted); }
:root[data-theme="classic"] .pickup { font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--muted); }
:root[data-theme="classic"] .pickup.on { color: var(--story); }
:root[data-theme="classic"] .pickup.bad { color: var(--warn); }
:root[data-theme="classic"] .pickup[data-act] { cursor: pointer; }
/* The Claude session working a tile: its own block, apart from the description. */
:root[data-theme="classic"] .session { margin-top: 6px; padding: 5px 8px; border-radius: 4px; border-left: 3px solid var(--story); background: color-mix(in srgb, var(--story) 10%, transparent); font-size: 12px; cursor: default; }
:root[data-theme="classic"] .session-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
:root[data-theme="classic"] .session-id { font-weight: 600; white-space: nowrap; }
:root[data-theme="classic"] .session-state { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
:root[data-theme="classic"] .session-state.s-started { color: var(--story); }
:root[data-theme="classic"] .session-state.s-lost { color: var(--warn); }
:root[data-theme="classic"] .session-acts { display: inline-flex; gap: 4px; margin-left: auto; white-space: nowrap; }  /* the buttons wrap together, never one by one */
:root[data-theme="classic"] .session button, :root[data-theme="classic"] .pickup-restart { padding: 1px 6px; font-size: 11px; }
:root[data-theme="classic"] .session button .spin { display: inline-block; }
:root[data-theme="classic"] .session button.busy .spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
:root[data-theme="classic"] .session-rest { margin-top: 3px; color: var(--muted); overflow-wrap: anywhere; }
:root[data-theme="classic"] .session.lost { border-left-color: var(--warn); background: var(--warn-soft); }
/* It waits for input: an amber block and outline that stay until it is answered. */
:root[data-theme="classic"] .session.waiting { border-left-color: var(--p2); background: color-mix(in srgb, var(--p2) 16%, transparent); }
:root[data-theme="classic"] .session-state.s-waiting, :root[data-theme="classic"] .session-state.s-paused { color: var(--p2); }
:root[data-theme="classic"] .session-state.s-pausing { color: var(--story); }
:root[data-theme="classic"] .session-ask { margin-top: 4px; font-weight: 700; color: var(--text); }
:root[data-theme="classic"] .card.needs-you { outline: 2px solid var(--p2); outline-offset: -2px; }
/* Finished and waiting for review: a green outline and note, until the tile is in Done. */
:root[data-theme="classic"] .card.ready { outline: 3px solid var(--done); outline-offset: -3px; }
:root[data-theme="classic"] .ready-note, :root[data-theme="classic"] .tv-ready { margin-top: 6px; padding: 5px 8px; border-radius: 4px; border-left: 3px solid var(--done); background: color-mix(in srgb, var(--done) 14%, transparent); font-size: 12px; }
:root[data-theme="classic"] .ready-note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
:root[data-theme="classic"] .ready-label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--done); }
:root[data-theme="classic"] .tv-ready { margin: 6px 0 12px; font-size: 14px; }
/* The story's latest status: a yellow tile under the session block. */
:root[data-theme="classic"] .tv-status { margin: 6px 0 12px; padding: 8px 10px; border-radius: 4px; border-left: 3px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 28%, var(--card)); }
:root[data-theme="classic"] .tv-status .tv-status-next { margin-top: 10px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--yellow) 60%, var(--card)); }
:root[data-theme="classic"] .tv-status dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 2px 0 0; }
:root[data-theme="classic"] .tv-status dt { font-size: 11px; font-weight: 700; color: var(--muted); padding-top: 2px; }
:root[data-theme="classic"] .tv-status dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
:root[data-theme="classic"] .tv-status dt:empty { display: none; }
:root[data-theme="classic"] .tv-status dt:empty + dd { grid-column: 1 / -1; }
:root[data-theme="classic"] .tv-status dl:not(.note) dt:first-child + dd { font-weight: 700; }
:root[data-theme="classic"] .tv-status .tv-status-at { display: block; margin-bottom: 2px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
/* Its session is gone: the tile flashes until it is restarted or moved on. */
:root[data-theme="classic"] .card.lost { animation: lost 1.1s ease-in-out infinite; }
@keyframes lost { 0%, 100% { outline: 2px solid var(--warn); outline-offset: -2px; background: var(--warn-soft); } 50% { outline: 2px solid transparent; outline-offset: -2px; background: var(--card); } }
@media (prefers-reduced-motion: reduce) { :root[data-theme="classic"] .card.lost { animation: none; outline: 2px solid var(--warn); outline-offset: -2px; } }
:root[data-theme="classic"] .keyref { color: var(--accent); cursor: pointer; }
:root[data-theme="classic"] .keyref:hover { text-decoration: underline; }
:root[data-theme="classic"] .master-mark { color: var(--story); font-size: 11px; cursor: help; }
:root[data-theme="classic"] .parent { font-size: 11px; font-weight: 600; white-space: nowrap; }
:root[data-theme="classic"] .kids .kstate { flex: none; width: 14px; text-align: center; color: var(--muted); }
:root[data-theme="classic"] .kids li.done .kstate { color: var(--done); }
:root[data-theme="classic"] .kids li.done > span:nth-child(2) { color: var(--muted); }
:root[data-theme="classic"] .kids .where { margin-left: auto; padding-left: 6px; white-space: nowrap; }
:root[data-theme="classic"] .card.jumped, :root[data-theme="classic"] .lcard.jumped { animation: jumped 1.8s ease-out; }
@keyframes jumped { 0%, 60% { outline: 3px solid var(--accent); outline-offset: 1px; } 100% { outline: 3px solid transparent; outline-offset: 1px; } }
:root[data-theme="classic"] .card .card { box-shadow: none; border: 1px solid var(--line); }
:root[data-theme="classic"] .fold { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
/* A sub-story away from its master sits under a greyed stub of the master, which jumps to it. */
:root[data-theme="classic"] .ghost { display: flex; flex-direction: column; gap: 4px; padding: 4px; border: 1px dashed var(--muted); border-radius: 6px; }
:root[data-theme="classic"] .ghost-head { display: flex; gap: 6px; align-items: baseline; padding: 4px 6px; border-radius: 4px; border-left: 3px solid var(--story); background: var(--card); font-size: 12px; font-weight: 600; color: var(--muted); opacity: .55; cursor: pointer; overflow-wrap: anywhere; }
:root[data-theme="classic"] .ghost-head span:first-child { white-space: nowrap; }
:root[data-theme="classic"] .ghost-head:hover { opacity: 1; color: var(--accent); }
:root[data-theme="classic"] .ghost-head em { margin-left: auto; font-style: normal; font-weight: 400; font-size: 11px; white-space: nowrap; }

/* ---------- the other themes ---------- */
/* The themes. Every look other than Classic is one set of the tokens below, picked by <html data-theme> (the header's Theme
   menu; see BOARD_THEMES). The defaults below are a sticker look
   (ink outlines, hard shadows, a glossy top half on every control and chip) that each theme reshapes. A theme's accent can be swapped by an inline --accent. */
:root:not([data-theme="classic"]) {

  --bugs: #ff9584; --todo: #ffd257; --flight: #9db1ff; --done: #8fdca6; --accent: #9db1ff;
  --on-accent: var(--ink);
  --ok: #1c6b3a;                                   /* "done" / success text */
  --neutral: var(--card);                          /* a plain ("white") button or chip */
  --p1: var(--bugs); --p1-fg: var(--ink); --p2: var(--todo); --p2-fg: var(--ink);
  --st-work: var(--done); --st-wait: var(--todo); --st-gone: var(--bugs);
  --ok-bg: var(--done); --ok-fg: var(--ink);       /* a ticked box, the Ready for review chip */
  --danger: var(--bugs); --danger-fg: var(--ink);
  --code: var(--col);
  /* outlines and shadows */
  --edge: #1c1c1a; --shadow-c: #1c1c1a; --dash: rgba(28,28,26,.45); --check-bc: var(--edge); --solid-edge: var(--edge);
  --bw: 1.5px; --ctl-radius: 6px;
  --ctl-shadow: 1px 1px 0 var(--shadow-c); --ctl-shadow-hover: 2px 2px 0 var(--shadow-c); --chip-shadow: var(--ctl-shadow);
  --input-bc: var(--edge);
  --gloss: linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,.18) 49%, rgba(255,255,255,0) 50%, rgba(0,0,0,.07) 100%);
  --gloss-hi: inset 0 1px 0 rgba(255,255,255,.9);
  --gloss-n: var(--gloss); --gloss-n-hi: var(--gloss-hi);   /* on a neutral surface: quieter in Tidy's dark */
  /* columns and tiles */
  --cards-pad: 0 3px 3px 0; --col-bd: 0 solid transparent; --col-radius: 18px; --col-shadow: none; --col-tint: 0%; --col-gap: 14px;
  --card-bw: 1.5px; --card-bc: var(--edge); --card-radius: 12px; --card-pad: 14px;
  --card-shadow: 2px 2px 0 var(--shadow-c); --card-shadow-hover: 3px 3px 0 var(--shadow-c); --dlg-shadow: 4px 4px 0 var(--shadow-c);
  --state-bw: 2.5px; --wait-bc: var(--edge); --ready-bc: var(--edge); --warn-bc: var(--edge);
  --tint: 25%;
  --waiting-bg: #fff3c4;
  --ready-bg: color-mix(in srgb, var(--done) var(--tint), var(--card));
  --warn-bg: color-mix(in srgb, var(--bugs) var(--tint), var(--card));
  --accent-bg: color-mix(in srgb, var(--accent) 25%, transparent);
  --rule: 1px dashed var(--dash);
  --track: var(--col); --track-bd: 1.5px solid var(--edge); --bar-h: 10px; --bar-radius: 6px;
  --bar: var(--done); --bar-review: var(--accent); --bar-gates: var(--todo); --bar-gloss: var(--gloss);
  --add-bd: 2px dashed var(--dash); --add-radius: 12px; --add-style: normal;
  --zone-bd: 2px dashed var(--dash); --zone-radius: 18px;
  /* header */
  --hdr-bg: #6b665b; --hdr-bd: 1.5px solid var(--ink); --hdr-name: #fffaf0; --hdr-text: #f1ebde;
  --hdr-edge: var(--ink); --hdr-ctl-shadow: 1px 1px 0 rgba(248,243,232,.35); --hdr-ctl-shadow-hover: 2px 2px 0 rgba(248,243,232,.35);
  --store-font: var(--head); --store-size: 22px; --store-weight: 700; --store-case: none; --store-track: normal;
  --h1-font: var(--sans); --h1-size: 18px; --h1-weight: 600; --h1-style: normal;
  --tab-bg: var(--neutral); --tab-fg: var(--text);
  /* the logo: the bare mark, or (Realm) a medallion */
  --logo-size: 42px; --logo-svg: 42px; --logo-bg: transparent; --logo-gloss: none;
  --logo-bd: 0 solid transparent; --logo-radius: 10px; --logo-shadow: none;

:root[data-theme="aqua"] {    /* F · Aqua bubble: sky gradient, frosted columns, soft-shadowed glossy chips */
  --solid-edge: #0c2a3e;
  --sans: Nunito, "Segoe UI", sans-serif; --head: Quicksand, "Trebuchet MS", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bg: #e6fbff; --ground: linear-gradient(180deg, #bfe9ff 0%, #e6fbff 50%, #d8ffd9 100%);

:root:not([data-theme="classic"]) body { background: var(--ground); color: var(--text); font: var(--body-size)/1.42 var(--sans); display: flex; flex-direction: column; }

/* ---------- the sticker: outline, shadow, gloss ---------- */
/* A sticker's colour comes from --sb (background) and --sf (text); a coloured one sets both, and

:root:not([data-theme="classic"]) select, :root:not([data-theme="classic"]) button, :root:not([data-theme="classic"]) input, :root:not([data-theme="classic"]) textarea { font: inherit; color: inherit; }

  box-shadow: var(--sh, var(--gloss-n-hi)), var(--ctl-shadow);
}
:root:not([data-theme="classic"]) .prio, :root:not([data-theme="classic"]) .session-state, :root:not([data-theme="classic"]) .pickup, :root:not([data-theme="classic"]) .ready-label, :root:not([data-theme="classic"]) .check { box-shadow: var(--sh, var(--gloss-n-hi)), var(--chip-shadow); }
:root:not([data-theme="classic"]) button { padding: 6px 12px; font-family: var(--btn-font); font-weight: var(--btn-weight); text-transform: var(--btn-case); letter-spacing: var(--btn-track); cursor: pointer; }

/* ---------- header ---------- */

:root:not([data-theme="classic"]) #status { margin-left: auto; color: var(--hdr-text); font: 12px var(--mono); }
:root:not([data-theme="classic"]) #status.err { color: var(--danger-fg); background-color: var(--danger); background-image: var(--gloss); border: var(--bw) solid var(--edge); border-radius: var(--ctl-radius); padding: 3px 8px; font-weight: 700; }
/* What the board tells you (flash): toasts in the bottom-right corner, over the board, not in its way. */

.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; max-width: min(440px, calc(100vw - 32px)); padding: 10px 12px 10px 14px;
  background: var(--card); color: var(--text); border-left: 4px solid var(--accent); border-radius: 8px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 6px 24px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12); overflow-wrap: anywhere; animation: toast-in .18s ease-out; }

.toast button.toast-close:hover { color: var(--text); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
:root:not([data-theme="classic"]) #search { width: 200px; }

/* ---------- board and columns ---------- */

:root:not([data-theme="classic"]) .column { flex: 1 1 280px; min-width: 280px; background: color-mix(in srgb, var(--colc, var(--col)) var(--col-tint), var(--col));

:root:not([data-theme="classic"]) .col-head { display: flex; align-items: center; gap: 8px; padding: 0 0 12px; cursor: grab; }
:root:not([data-theme="classic"]) .col-name { font: var(--name-weight) var(--name-size)/1.42 var(--head); text-transform: var(--name-case); letter-spacing: var(--name-track); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:root:not([data-theme="classic"]) .col-head .col-name, :root:not([data-theme="classic"]) .list-head .col-name { flex: 0 1 auto; min-width: 0; padding: 5px 16px; line-height: 1.25; }
:root:not([data-theme="classic"]) .col-count { font: 13px var(--mono); color: var(--muted); }
:root:not([data-theme="classic"]) .col-head .col-count { margin-right: auto; }
:root:not([data-theme="classic"]) .col-head button { padding: 2px 6px; min-height: 28px; font-weight: 600; }
:root:not([data-theme="classic"]) .col-head .col-clear { font-size: 13px; font-weight: 700; }
:root:not([data-theme="classic"]) .col-intro { margin: 0 2px 10px; font-size: 13px; color: var(--muted); }
:root:not([data-theme="classic"]) .col-intro summary { cursor: pointer; }
:root:not([data-theme="classic"]) .col-intro div { white-space: pre-wrap; margin-top: 4px; max-height: 160px; overflow: auto; }
/* Why pickup is off: one muted line at the top of In flight, with a × that hides it. */
:root:not([data-theme="classic"]) .pickup-why { display: flex; align-items: flex-start; gap: 6px; margin: 0 2px 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
:root:not([data-theme="classic"]) .pickup-why span { flex: 1; }
:root:not([data-theme="classic"]) .pickup-why button { padding: 0 6px; line-height: 1.42; }
/* Room on the right and below for the tiles' shadows, which overflow would otherwise clip. */
:root:not([data-theme="classic"]) .cards { padding: var(--cards-pad); display: flex; flex-direction: column; gap: 12px; min-height: 40px; overflow-y: auto; }
:root:not([data-theme="classic"]) .add-card { margin-top: 12px; width: 100%; min-height: 40px; text-align: left; padding: 8px 14px; font-family: var(--sans); text-transform: none; letter-spacing: normal;
  background: transparent; border: var(--add-bd); border-radius: var(--add-radius); box-shadow: none; color: var(--muted); font-size: 14px; font-weight: 700; font-style: var(--add-style); }
:root:not([data-theme="classic"]) .add-card:hover { border-color: var(--edge); color: var(--text); box-shadow: none; }

/* ---------- tiles ---------- */
/* A tile's state swaps its background and outline (--this-bg, --bw-now, --bc-now); the padding gives back what a heavier outline takes. */
:root:not([data-theme="classic"]) .card { --this-bg: var(--card); --bw-now: var(--card-bw); --bc-now: var(--card-bc);
  background: var(--this-bg); border: var(--bw-now) solid var(--bc-now); border-radius: var(--card-radius); box-shadow: var(--card-shadow);
  padding: calc(var(--card-pad) + var(--card-bw) - var(--bw-now)); display: flex; flex-direction: column; gap: 7px; cursor: pointer; user-select: none; overflow-wrap: anywhere; }
:root:not([data-theme="classic"]) .card:hover { box-shadow: var(--card-shadow-hover); }
:root:not([data-theme="classic"]) .card.dragging { opacity: .35; }
:root:not([data-theme="classic"]) .card > .meta { order: -1; }  /* the key, priority and estimate read first */
:root:not([data-theme="classic"]) .card .title { font: 600 var(--title-size)/1.3 var(--title-font); }
:root:not([data-theme="classic"]) .card .desc { color: var(--muted); font-size: var(--desc-size); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
:root:not([data-theme="classic"]) .card .meta { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; font: 11px var(--mono); color: var(--muted); }
:root:not([data-theme="classic"]) .card.done .title { text-decoration: line-through; color: var(--muted); }
:root:not([data-theme="classic"]) .card.done .key { text-decoration: line-through; }
:root:not([data-theme="classic"]) .card .kind { font: 600 11px var(--mono); color: var(--muted); }
:root:not([data-theme="classic"]) .card .card { --card-shadow: var(--card-shadow-nested, var(--ctl-shadow)); --card-shadow-hover: var(--ctl-shadow-hover); }
:root:not([data-theme="classic"]) .check { width: 16px; height: 16px; padding: 0; border-radius: 4px; border-color: var(--check-bc); box-shadow: var(--chip-shadow); display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--sans); }
:root:not([data-theme="classic"]) .check.on { --sb: var(--ok-bg); --sf: var(--ok-fg); border-color: var(--edge); }
:root:not([data-theme="classic"]) .key { font: 600 11px var(--mono); color: var(--text); }
:root:not([data-theme="classic"]) .est, :root:not([data-theme="classic"]) .model, :root:not([data-theme="classic"]) .repos { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
:root:not([data-theme="classic"]) .repos-pick { display: inline-flex; align-items: center; gap: 6px; }
:root:not([data-theme="classic"]) .repos-pick label { display: inline-flex; align-items: center; gap: 3px; }
/* Small chips: priority, pickup and session state. */
:root:not([data-theme="classic"]) .prio, :root:not([data-theme="classic"]) .session-state, :root:not([data-theme="classic"]) .pickup { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; min-height: 18px; font: 700 11px var(--mono); white-space: nowrap; line-height: 1.3; }
:root:not([data-theme="classic"]) .prio-P1 { --sb: var(--p1); --sf: var(--p1-fg); }
:root:not([data-theme="classic"]) .prio-P2 { --sb: var(--p2); --sf: var(--p2-fg); }
:root:not([data-theme="classic"]) .linked { display: inline-flex; align-items: center; color: var(--link); cursor: help; }
:root:not([data-theme="classic"]) .linked svg { width: 12px; height: 12px; }
:root:not([data-theme="classic"]) .pickup.on { --sb: var(--st-work); }   /* ✦ Claude: working */
:root:not([data-theme="classic"]) .pickup.bad { --sb: var(--st-gone); }  /* idle, gone, not started */
:root:not([data-theme="classic"]) .pickup[data-act] { cursor: pointer; border-style: dashed; border-color: var(--check-bc); }  /* ◌ queued */
:root:not([data-theme="classic"]) .keyref { color: var(--link); cursor: pointer; }
:root:not([data-theme="classic"]) .keyref:hover { text-decoration: underline; }
:root:not([data-theme="classic"]) .master-mark { color: var(--text); font-size: 11px; cursor: help; }
:root:not([data-theme="classic"]) .parent { font: 600 11px var(--mono); white-space: nowrap; }
:root:not([data-theme="classic"]) .card a { color: var(--link); }

/* The Claude session working a tile: its own block under a rule. */
:root:not([data-theme="classic"]) .session { padding-top: 8px; border-top: var(--rule); font-size: 13px; cursor: default; }
:root:not([data-theme="classic"]) .session-top { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; }
:root:not([data-theme="classic"]) .session-state { order: -1; }
:root:not([data-theme="classic"]) .session-state.s-started { --sb: var(--st-work); }   /* working */
:root:not([data-theme="classic"]) .session-state:is(.s-waiting, .s-paused) { --sb: var(--st-wait); }   /* waiting for you, paused */
:root:not([data-theme="classic"]) .session-state.s-pausing { --sb: var(--st-work); }   /* writing its handoff */
:root:not([data-theme="classic"]) .session-state.s-lost { --sb: var(--st-gone); }      /* gone */
:root:not([data-theme="classic"]) .session-id { font-size: 12px; color: var(--muted); white-space: nowrap; }
:root:not([data-theme="classic"]) .session-id code { background: none; padding: 0; font: 600 12px var(--mono); color: var(--text); }
:root:not([data-theme="classic"]) .session-acts { display: flex; flex-wrap: wrap; flex-basis: 100%; gap: 6px; margin-top: 2px; }  /* the buttons on a row of their own, as the designs draw them */
:root:not([data-theme="classic"]) .session button, :root:not([data-theme="classic"]) .pickup-restart { min-height: 32px; padding: 3px 10px; font-size: 13px; line-height: normal; }
:root:not([data-theme="classic"]) .session button .spin { display: inline-block; }
:root:not([data-theme="classic"]) .session button.busy .spin { animation: spin .7s linear infinite; }
:root:not([data-theme="classic"]) .session-rest { margin-top: 5px; color: var(--muted); overflow-wrap: anywhere; }
:root:not([data-theme="classic"]) .session-ask { margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--text); }
/* It waits for input: the whole tile changes, with a heavier outline, until it is answered. */
:root:not([data-theme="classic"]) .card.needs-you { --this-bg: var(--waiting-bg); --bw-now: var(--state-bw); --bc-now: var(--wait-bc); }
/* Finished and waiting for review: a green tile and note, until the tile is in Done. */
:root:not([data-theme="classic"]) .card.ready { --this-bg: var(--ready-bg); --bw-now: var(--state-bw); --bc-now: var(--ready-bc); }
:root:not([data-theme="classic"]) .ready-note, :root:not([data-theme="classic"]) .tv-ready { font-size: 13px; }
:root:not([data-theme="classic"]) .ready-note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
:root:not([data-theme="classic"]) .ready-label { display: inline-block; margin-right: 6px; padding: 0 6px; font: 700 11px var(--mono); line-height: 1.5; --sb: var(--ok-bg); --sf: var(--ok-fg); }
:root:not([data-theme="classic"]) .tv-ready { margin: 6px 0 12px; font-size: 14px; }
/* In Done, but its branch isn't in the trunk yet: a red tile, and a label to say so. */
:root:not([data-theme="classic"]) .card.unmerged { --this-bg: var(--warn-bg); --bw-now: var(--state-bw); --bc-now: var(--warn-bc); }
:root:not([data-theme="classic"]) .card.unmerged > .meta::after { content: "not merged"; padding: 0 6px; border: var(--bw) solid var(--edge); border-radius: var(--ctl-radius); font-weight: 700; color: var(--danger-fg);
  background-color: var(--danger); background-image: var(--gloss); box-shadow: var(--gloss-hi), var(--chip-shadow); }
/* Its session is gone: the tile flashes until it is restarted or moved on. */
:root:not([data-theme="classic"]) .card.lost { --bw-now: var(--state-bw); --bc-now: var(--warn-bc); animation: t-lost 1.1s ease-in-out infinite; }
@keyframes t-lost { 0%, 100% { background: var(--warn-bg); } 50% { background: var(--card); } }
@media (prefers-reduced-motion: reduce) { :root:not([data-theme="classic"]) .card.lost { animation: none; --this-bg: var(--warn-bg); } }
:root:not([data-theme="classic"]) .card.jumped, :root:not([data-theme="classic"]) .lcard.jumped { animation: t-jumped 1.8s ease-out; }
@keyframes t-jumped { 0%, 60% { outline: 3px solid var(--link); outline-offset: 2px; } 100% { outline: 3px solid transparent; outline-offset: 2px; } }

/* A story's progress: a track, a fill, and the count beside it. */
:root:not([data-theme="classic"]) .progress { position: relative; height: var(--bar-h); margin-right: 52px; background: var(--track); border: var(--track-bd); border-radius: var(--bar-radius); }
:root:not([data-theme="classic"]) .progress span { display: block; height: 100%; border-radius: max(0px, calc(var(--bar-radius) - 2px)); background-color: var(--bar); background-image: var(--bar-gloss); }
:root:not([data-theme="classic"]) .progress::after { content: attr(data-count); position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 8px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
:root:not([data-theme="classic"]) .progress.review span { background-color: var(--bar-review); }
:root:not([data-theme="classic"]) .progress.gates span { background-image: var(--bar-gloss), repeating-linear-gradient(-45deg, var(--bar-gates) 0 6px, color-mix(in srgb, var(--bar-gates) 45%, var(--card)) 6px 12px); }
:root:not([data-theme="classic"]) .expand { padding: 0; min-height: 0; font: 11px var(--mono); }
:root:not([data-theme="classic"]) .subs { list-style: none; margin: 0; padding: 8px 0 0; border-top: var(--rule); display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
:root:not([data-theme="classic"]) .subs li { display: flex; gap: 6px; align-items: flex-start; }
:root:not([data-theme="classic"]) .subs li .check { flex: none; margin-top: 2px; cursor: pointer; }
:root:not([data-theme="classic"]) .subs li.done > span:last-child { text-decoration: line-through; color: var(--muted); }
:root:not([data-theme="classic"]) .subs em { color: var(--muted); font: 11px var(--mono); }
:root:not([data-theme="classic"]) .add-sub { padding: 0; min-height: 0; font-size: 12px; font-weight: 700; }
:root:not([data-theme="classic"]) .kids .kstate { flex: none; width: 14px; text-align: center; color: var(--muted); }
:root:not([data-theme="classic"]) .kids li.done .kstate { color: var(--ok); font-weight: 700; }
:root:not([data-theme="classic"]) .kids li.done > span:nth-child(2) { color: var(--muted); }
:root:not([data-theme="classic"]) .kids .where { margin-left: auto; padding-left: 6px; white-space: nowrap; }
:root:not([data-theme="classic"]) .fold { display: flex; flex-direction: column; gap: 8px; }
/* A sub-story away from its master sits under a quiet stub of the master, which jumps to it. */
:root:not([data-theme="classic"]) .ghost { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 2px dashed var(--dash); border-radius: calc(var(--card-radius) + 2px); }
:root:not([data-theme="classic"]) .ghost-head { display: flex; gap: 6px; align-items: baseline; padding: 2px 6px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; overflow-wrap: anywhere; }
:root:not([data-theme="classic"]) .ghost-head span:first-child { white-space: nowrap; font-family: var(--mono); }
:root:not([data-theme="classic"]) .ghost-head:hover { color: var(--text); text-decoration: underline; }
:root:not([data-theme="classic"]) .ghost-head em { margin-left: auto; font: 11px var(--mono); white-space: nowrap; }

/* ---------- drag targets ---------- */
:root:not([data-theme="classic"]) .placeholder { border: 2px dashed var(--solid-edge); border-radius: var(--card-radius); min-height: 36px; background: var(--accent-bg); }
:root:not([data-theme="classic"]) .col-placeholder { flex: 0 0 280px; border: 2px dashed var(--solid-edge); border-radius: var(--col-radius); align-self: stretch; background: var(--accent-bg); }
/* The right-hand column: Archive, and under it the other board's columns to send a tile to. */
:root:not([data-theme="classic"]) .side-col { flex: 0 0 220px; display: flex; flex-direction: column; gap: 14px; align-self: stretch; }
:root:not([data-theme="classic"]) .archive-col { background: transparent; border: var(--zone-bd); border-radius: var(--zone-radius); padding: 14px 16px; color: var(--muted); font-size: 14px; }
:root:not([data-theme="classic"]) .archive-col > .col-name { font-size: var(--name-size); color: var(--text); }
:root:not([data-theme="classic"]) .archive-col p { margin: 6px 0 10px; }
:root:not([data-theme="classic"]) .archive-col.over { border-color: var(--solid-edge); background: var(--accent-bg); color: var(--text); }
:root:not([data-theme="classic"]) .move-zone { display: flex; align-items: center; gap: 8px; margin: 8px 0; padding: 8px 12px; border: var(--zone-bd); border-radius: var(--add-radius); font-size: 14px; font-weight: 700; color: var(--text); }
:root:not([data-theme="classic"]) .move-zone::before { content: ""; flex: none; width: 12px; height: 12px; border: 1.5px solid var(--solid-edge); border-radius: 4px; background-color: var(--colc, var(--neutral)); background-image: var(--gloss); }
:root:not([data-theme="classic"]) .move-zone.over { border-style: solid; border-color: var(--solid-edge); background: var(--accent-bg); }

/* ---------- the archive log, as a list: wide cards, clamped to 10 rows until clicked ---------- */
:root:not([data-theme="classic"]) #board.as-list { flex-direction: column; align-items: center; overflow-x: hidden; overflow-y: auto; }
:root:not([data-theme="classic"]) .list-group { width: 66.667vw; display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
:root:not([data-theme="classic"]) .list-head { display: flex; align-items: center; gap: 10px; }
:root:not([data-theme="classic"]) .list-head .spacer { flex: 1; }
:root:not([data-theme="classic"]) .list-head label { font-size: 13px; color: var(--muted); }
:root:not([data-theme="classic"]) .lcard { background: var(--card); border: var(--card-bw) solid var(--card-bc); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: 14px 18px; }
:root:not([data-theme="classic"]) .lcard.clamped { cursor: pointer; }
:root:not([data-theme="classic"]) .lcard.clamped:hover { box-shadow: var(--card-shadow-hover); }
:root:not([data-theme="classic"]) .lcard .lc-body { max-height: 14.2em; overflow: hidden; }  /* 10 rows at the 1.42 line height */
:root:not([data-theme="classic"]) .lcard.clamped:not(.open) .lc-body { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
:root:not([data-theme="classic"]) .lcard.open .lc-body { max-height: none; }
:root:not([data-theme="classic"]) .lcard .lc-body h3 { font: 600 var(--title-size)/1.42 var(--title-font); }
:root:not([data-theme="classic"]) .lcard .lc-body p:last-child, :root:not([data-theme="classic"]) .lcard .lc-body ul:last-child { margin-bottom: 0; }
:root:not([data-theme="classic"]) .lcard .tv-tasks .check { cursor: inherit; }
:root:not([data-theme="classic"]) .lc-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-top: 8px; border-top: var(--rule); font: 12px var(--mono); color: var(--muted); }
:root:not([data-theme="classic"]) .lc-foot .spacer { flex: 1; }
:root:not([data-theme="classic"]) .lc-foot button { padding: 2px 10px; min-height: 28px; font-size: 13px; line-height: normal; }
:root:not([data-theme="classic"]) .lc-more { color: var(--link); }
:root:not([data-theme="classic"]) .lcard:not(.clamped) .lc-more { display: none; }
@media (max-width: 900px) { :root:not([data-theme="classic"]) .list-group { width: 100%; } }

/* ---------- dialogs ---------- */
:root:not([data-theme="classic"]) dialog { border: var(--card-bw) solid var(--card-bc); border-radius: var(--card-radius); padding: 0; width: min(780px, 94vw); background: var(--card); color: var(--text); box-shadow: var(--dlg-shadow); }
:root:not([data-theme="classic"]) dialog::backdrop { background: rgba(28,28,26,.45); }
:root:not([data-theme="classic"]) dialog.ask { width: min(460px, 94vw); }
:root:not([data-theme="classic"]) .ask h3 { margin: 0; font: 700 17px/1.42 var(--head); }
:root:not([data-theme="classic"]) .ask #askBody { font-size: 14px; line-height: 1.5; color: var(--text); }
:root:not([data-theme="classic"]) .ask #askBody p { margin: 0 0 8px; }
:root:not([data-theme="classic"]) .ask #askBody p:last-child { margin-bottom: 0; }
:root:not([data-theme="classic"]) .ask #askBody .ask-note { color: var(--muted); }
:root:not([data-theme="classic"]) .ask #askField { display: flex; align-items: center; gap: 8px; }
:root:not([data-theme="classic"]) .ask #askField[hidden] { display: none; }
:root:not([data-theme="classic"]) .ask #askInput { flex: 1; min-width: 0; padding: 6px 9px; font: inherit; }
:root:not([data-theme="classic"]) .ask #askInput[type=number] { flex: 0 0 72px; }
:root:not([data-theme="classic"]) .dlg { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
:root:not([data-theme="classic"]) .dlg label { font-size: 13px; font-weight: 600; color: var(--muted); }
:root:not([data-theme="classic"]) .dlg select, :root:not([data-theme="classic"]) .dlg input[type=text] { min-height: 32px; }
:root:not([data-theme="classic"]) .dlg textarea { width: 100%; min-height: 260px; padding: 9px; font: 13px/1.5 var(--mono); resize: vertical; }
:root:not([data-theme="classic"]) .dlg .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
:root:not([data-theme="classic"]) .dlg .row label { white-space: nowrap; }
:root:not([data-theme="classic"]) .dlg .row .spacer { flex: 1; }
:root:not([data-theme="classic"]) #cardEst::placeholder { color: var(--muted); font-style: italic; }
:root:not([data-theme="classic"]) #cardEst.bad { border-color: var(--warn-bc); border-width: 2.5px; background: var(--warn-bg); }
:root:not([data-theme="classic"]) #cardDlg[data-mode="view"] .edit-only, :root:not([data-theme="classic"]) #cardDlg[data-mode="edit"] .tile-view { display: none; }
:root:not([data-theme="classic"]) .tile-view { max-height: 60vh; overflow: auto; font-size: var(--body-size); }
:root:not([data-theme="classic"]) .tile-view .tv-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
:root:not([data-theme="classic"]) .tile-view .tv-head .key { font-size: 12px; }
:root:not([data-theme="classic"]) .tile-view h3 { margin: 0 0 6px; font: 700 20px/1.42 var(--title-font); }
:root:not([data-theme="classic"]) .tile-view p { margin: 0 0 10px; }
:root:not([data-theme="classic"]) .tile-view a { color: var(--link); }
:root:not([data-theme="classic"]) .tv-tasks, :root:not([data-theme="classic"]) .tv-bullets { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 6px; }
:root:not([data-theme="classic"]) .tv-tasks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; }
:root:not([data-theme="classic"]) .tv-tasks .check { margin-top: 2px; cursor: pointer; }
:root:not([data-theme="classic"]) .tv-tasks li.done > span:nth-child(2) { text-decoration: line-through; color: var(--muted); }
:root:not([data-theme="classic"]) .tv-sub { grid-column: 2; color: var(--muted); font-size: 14px; }
:root:not([data-theme="classic"]) .tv-bullets li::before { content: "• "; color: var(--muted); }
/* The story's latest status: a yellow note under the session block. */
:root:not([data-theme="classic"]) .tv-status { margin: 6px 0 12px; padding: 10px 12px; border: var(--card-bw) solid var(--wait-bc); border-radius: var(--card-radius); background: var(--waiting-bg); }

// The board's looks: Clean and light (the default: the first one here), Classic (the original),
// then the rest of the style block's [data-theme] blocks, each with the accents it offers, its
// default first. The pick is kept in this browser and applied here, before the first paint.
const BOARD_THEMES = {
  light: { name: "Clean and light", accents: [["#2f4bd8", "Blue"], ["#6b3fd0", "Violet"], ["#0f6a73", "Teal"], ["#a3306e", "Berry"]] },
  classic: { name: "Classic", accents: [["#0c66e4", "Blue"]] },
  aqua: { name: "Aqua bubble", accents: [["#3fb6ff", "Sky"], ["#7fe38f", "Lime"], ["#ffd95a", "Lemon"], ["#ff9ecb", "Bubblegum"]] },
  sticker: { name: "Sticker pop", accents: [["#ff5a8a", "Pink"], ["#3dd6c4", "Teal"], ["#ffc21a", "Yellow"], ["#9d7bff", "Violet"]] },
  realm: { name: "Realm ledger", accents: [["#7a2a22", "Oxblood"], ["#1f4a5a", "Deep teal"], ["#4a2f5e", "Plum"], ["#5a4410", "Umber"]] },
  soft: { name: "Soft and sunny", accents: [["#c3b8ff", "Lavender"], ["#ffb3a6", "Peach"], ["#a9e3b9", "Mint"], ["#ffdc7a", "Butter"]] },
};
function storedTheme() {
  let theme = "";
  try { theme = localStorage.getItem("board.theme") || ""; } catch {}
  return Object.prototype.hasOwnProperty.call(BOARD_THEMES, theme) ? theme : Object.keys(BOARD_THEMES)[0];
}
function storedAccent(theme) {
  let accent = "";
  try { accent = localStorage.getItem("board.accent." + theme) || ""; } catch {}
  const offered = BOARD_THEMES[theme].accents;
  return offered.some(([c]) => c === accent) ? accent : offered[0][0];
}
// A theme's own accent needs no inline value; another of its accents overrides --accent.
function applyTheme(theme, accent) {
  const root = document.documentElement;
  root.dataset.theme = theme;
  if (accent === BOARD_THEMES[theme].accents[0][0]) root.style.removeProperty("--accent");
  else root.style.setProperty("--accent", accent);
}
let themeNow = storedTheme(), accentNow = storedAccent(themeNow);
applyTheme(themeNow, accentNow);
</script>

<script>
"use strict";
let rawText = "", docEditing = false, lastBoard = "plans.md";
let readonly = false, file = null, mtime = null, doc = null, dirty = false, saving = false, dragging = null, editing = null;
let nextId = 1;
const $ = s => document.querySelector(s);
const boardEl = $("#board"), statusEl = $("#status"), toastsEl = $("#toasts");

// ---------- markdown <-> board ----------
function parse(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const d = { preamble: [], sections: [] };
  let sec = null, card = null;
  for (const line of lines) {
    const h = line.match(/^## (.*)$/);
    if (h) { sec = { id: nextId++, name: h[1].trim(), intro: [], cards: [] }; d.sections.push(sec); card = null; continue; }
    if (!sec) { d.preamble.push(line); continue; }
    const c = line.match(/^[-*] (?:\[( |x|X)\] )?(.*)$/);
    if (c) {
      card = { id: nextId++, check: c[1] === undefined ? null : c[1] !== " ", text: c[2], body: [] };
      sec.cards.push(card); continue;
    }
    if (card && (line.trim() === "" || /^\s/.test(line))) { card.body.push(line); continue; }
    card = null;
    sec.intro.push(line);
  }
  return d;
}
const trimBlank = a => { a = a.slice(); while (a.length && !a[0].trim()) a.shift(); while (a.length && !a[a.length - 1].trim()) a.pop(); return a; };
function cardMarkdown(c) {
  const box = c.check === null ? "" : c.check ? "[x] " : "[ ] ";
  return ["- " + box + c.text, ...trimBlank(c.body)].join("\n");
}
function serialize(d) {
  const parts = [];
  const pre = trimBlank(d.preamble);
  if (pre.length) parts.push(pre.join("\n"));
  for (const s of d.sections) {
    const chunk = ["## " + s.name];
    const intro = trimBlank(s.intro);
    if (intro.length) chunk.push(intro.join("\n"));
    if (s.cards.length) chunk.push(s.cards.map(cardMarkdown).join("\n"));
    parts.push(chunk.join("\n\n"));
  }
  return parts.join("\n\n") + "\n";

// Whether a board file opens as a board (d: parse(text)): it comes back from serialize the same
// but for blank lines, such as a tile written straight under its column's heading or a blank
// line between two tiles, which the board puts right the next time it saves. Anything else
// (prose outside a tile, a heading the board doesn't know) would change the file, so it opens
// view-only instead (check.js says why).
const nonBlank = text => text.replace(/\r\n/g, "\n").split("\n").filter(line => line.trim()).join("\n");
function readsAsBoard(text, d) {
  return nonBlank(serialize(d)) === nonBlank(text);
}

// ---------- rendering ----------
// ---------- the columns a board has one of ----------
// In flight and Done, under whatever name: In flight, in-flight, In progress (or a slip of it,
// "In progrees"), Doing, WIP...; Done, Shipped, Completed, Merged... Never a name that says
// "not". A board has one of each at most: renaming a column refuses a second, and kandalf
// check (check.js) fails a board that has two.
const IN_FLIGHT_RE = /^(?!.*\bnot\b).*\b(?:in[\s_-]*flight|progre\w*|doing|wip|working|under[\s_-]*way|ongoing|active)\b/i;  // pickup.py
const DONE_COL_RE = /^(?!.*\bnot\b).*\b(?:done|shipped|completed?|finished|closed|merged|released|deployed|delivered|resolved)\b/i;  // serve.py
const isDoneCol = name => DONE_COL_RE.test(name);
function columnKind(name) {
  if (IN_FLIGHT_RE.test(name)) return "In flight";
  if (DONE_COL_RE.test(name)) return "Done";

// The column, other than sec, that already is the kind the name would make sec, or null.
function kindTaken(sections, name, sec) {
  const kind = columnKind(name);
  return kind ? sections.find(s => s !== sec && columnKind(s.name) === kind) || null : null;

// Each kind the board has more than one of, with those columns' names: [["Done", ["Done", "Shipped"]]].
function doubledKinds(sections) {
  return ["In flight", "Done"].map(kind => [kind, sections.filter(s => columnKind(s.name) === kind).map(s => s.name)])
    .filter(([, names]) => names.length > 1);
}

const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
// A markdown link to another plan in this folder opens it on the board; a web link opens in a
// new tab; any other link shows its text.

// POST the board as it reads now to one of the server's board actions. Returns the reply once
// it is adopted and shown, or null (said why) when nothing was done.
async function boardAction(path, body, doing) {
  if (saving) { flash("Still saving; try again in a moment."); return null; }
  clearTimeout(saveTimer);
  saving = true; setStatus(doing);
  let done = null;
  try {
    const r = await fetch(`${path}?file=${encodeURIComponent(file)}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mtime, text: serialize(doc), ...body }) });
    const j = await r.json();
    if (r.ok) { adopt(j); done = j; setStatus("Saved ✓ " + new Date().toLocaleTimeString()); }
    else if (j.text) { adopt(j); setStatus("Reloaded", true); flash(`${file} changed on disk, so nothing was done. Reloaded it; try again.`); }
    else { flash("That didn't work: " + (j.error || r.status)); setStatus("Not done", true); }
  } catch (err) { flash("That didn't work: server down?"); }
  saving = false;
  return done;
}

  if (!n) return flash(`Nothing to clear in ${sec.name}. ${staying}`);

// Archive a tile: the server moves the plan docs it links into archive/, rewrites links to
// them, writes the board without the tile, and files the tile in archive/archived.md.
async function archiveCard(id) {
  const f = findCard(id); if (!f) return;
  if (saving) return flash("Still saving; try again in a moment.");
  const links = [f.c.text, ...f.c.body].join("\n").match(/\]\(((?:active\/)?[\w.-]+\.md)\)/g) || [];
  const docs = [...new Set(links.map(m => m.slice(2, -1)))].filter(n => n !== file);
  const title = splitCard(f.c.text).title.replace(/\*\*|`/g, "");
  const moves = docs.length ? `\n\nMoves ${docs.join(", ")} into archive/ and updates links to ${docs.length > 1 ? "them" : "it"}.` : "";
  if (!await ask({ title: "Archive this tile?", ok: "Archive", body: `<b>${esc(cardKey(f.c) || "")}</b> ${esc(title)}`, note: esc(moves.trim()) })) return;
  clearTimeout(saveTimer);
  const tile = cardMarkdown(f.c);
  f.s.cards.splice(f.i, 1);
  saving = true; setStatus("Archiving…");
  try {
    const r = await fetch(`/api/archive?file=${encodeURIComponent(file)}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mtime, text: serialize(doc), tile, docs }) });
    const j = await r.json();
    if (r.ok) {
      adopt(j); render();
      setStatus("Saved ✓ " + new Date().toLocaleTimeString());
      flash(`Archived "${title}"` + (j.moved.length ? `, and moved ${j.moved.join(", ")} into archive/.` : ".") + tidiedNote(j));
    } else if (j.text) {
      adopt(j); render(); setStatus("Reloaded", true);
      flash(`${file} changed on disk, so nothing was archived. Reloaded it; try again.`);
    } else {
      flash("Archive failed: " + (j.error || r.status)); await reloadQuiet();
    }
  } catch (err) { flash("Archive failed: server down?"); }
  saving = false;
}

// Jump to a tile by key: on this board, or on the board the index says it is on. Used by
// every key link (a mention, a master's sub-story row, a sub-story's ◇ chip).
async function jumpTo(key) {

    dlg.close("cancel");

    await openFile(t.file);

  }
  if (!matchesFilter(f.c, $("#search").value.trim().toLowerCase()) || (statFilter && buildState(f.c, f.s) !== statFilter)) { $("#search").value = ""; statFilter = ""; render(); }
  const find = () => boardEl.querySelector(`.card[data-id="${f.c.id}"], .lcard[data-id="${f.c.id}"]`);
  if (!find()) {  // folded into a collapsed master: open the masters above it
    const index = tileIndex();

  if (live) {
    const id = session?.id || job?.id;
    body.push(job?.state === "waiting" && !id ? `It leaves the queue for ${esc(AGENT)}.` : [
      `Its work is thrown away too:`,
      id ? `· the ${esc(AGENT)} session <code>${esc(id)}</code> is stopped and removed` : "",
      job?.worktree ? `· its worktree <code>${esc(job.worktree)}</code> is removed, with anything uncommitted in it` : "· its worktree is removed, with anything uncommitted in it",
      job?.branch ? `· its branch <code>${esc(job.branch)}</code> is deleted if it has no commits of its own, else kept` : "",
    ].filter(Boolean).join("<br>"));
  }
  if (!await ask({ title: live ? `Delete ${key} and its ${AGENT} session?` : "Delete this tile?", body, ok: "Delete", danger: true })) return;
  if (live) {
    const tile = [card.text, ...(card.body || [])].join("\n");
    const j = await postPickup({ key, discard: true, tile }).catch(() => null);
    if (!j) return flash(`${key} wasn't deleted: its session and worktree couldn't be thrown away (server down?)`);
    if (j.discarded?.length) flash(j.discarded.join("\n"), `${key} deleted`);
  }
  const f = findCard(card.id); f.s.cards.splice(f.i, 1);
  dlg.close("deleted"); changed();
});
dlg.addEventListener("close", () => {
  const ed = editing; editing = null;
  if (dlg.returnValue !== "save" || !ed) return;
  const lines = $("#cardText").value.replace(/\s+$/, "").split("\n");
  if (!lines[0].trim()) return;
  const body = lines.slice(1).map(l => (!l.trim() || /^\s/.test(l)) ? l : "  " + l);
  const toSec = findSec($("#cardCol").value);
  let card = ed.card;
  if (!card) {
    card = { id: nextId++, check: false, text: "", body: [] };
    const master = ed.kidOf ? toSec.cards.findIndex(c => cardKey(c) === ed.kidOf) : -1;
    master >= 0 ? toSec.cards.splice(master + 1, 0, card) : toSec.cards.push(card);
  }
  card.text = lines[0].replace(/^[-*] (\[[ xX]\] )?/, "");
  card.body = body;
  card.check = $("#cardCheck").checked;
  const fromSec = ed.card && findCard(card.id).s, moved = ed.card && toSec !== fromSec;
  if (moved) moveCard(card.id, toSec, toSec.cards.length);
  if (ed.kidOf) { const m = findCardByKey(ed.kidOf); if (m && !expanded.has(m.c.text)) toggleExpanded(m.c.text); }  // show the new sub-story in its master
  const settled = moved ? movedColumn(card, toSec, fromSec) : changed();
  // The move may have reloaded the board, so the master is found again by its key.
  if (ed.addKid && cardKey(card)) Promise.resolve(settled).then(() => { const f = findCardByKey(cardKey(card)); if (f) openCard(null, f.s, cardKey(card)); });
});

// ---------- persistence ----------
function setStatus(t, err) { statusEl.textContent = t; statusEl.classList.toggle("err", !!err); }
// Tell the user something in a toast: it goes after 5 seconds, or stays while the pointer is
// on it, and × closes it at once; the newest three are kept. title: a bold first line.
function flash(msg, title = "") {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="toast-text">${title ? `<b>${esc(title)}</b>` : ""}${esc(msg)}</div><button type="button" class="toast-close" title="Close" aria-label="Close">×</button>`;
  const close = () => { el.classList.add("leaving"); setTimeout(() => el.remove(), 200); };
  let timer;
  const wait = () => { clearTimeout(timer); timer = setTimeout(close, 5000); };
  el.querySelector(".toast-close").onclick = close;
  el.onmouseenter = () => clearTimeout(timer);
  el.onmouseleave = wait;
  toastsEl.append(el);
  while (toastsEl.children.length > 3) toastsEl.firstElementChild.remove();
  wait();
}
let saveTimer = null;
function scheduleSave() { setStatus("Unsaved…"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
async function save() {
  if (saving) return scheduleSave();
  saving = true; setStatus("Saving…");
  try {
    const r = await fetch(`/api/board?file=${encodeURIComponent(file)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: serialize(doc), mtime }) });
    const j = await r.json();
    if (r.status === 409) {
      adopt(j); render();
      flash(`${file} changed on disk (another session or editor). Reloaded it; redo your last move.`);
      setStatus("Reloaded", true);
    } else if (!r.ok) { setStatus("Save failed: " + (j.error || r.status), true); }
    else { mtime = j.mtime; dirty = false; if (j.linked) serverLinks = j.linked; if (j.tiles) serverTiles = j.tiles; setStatus("Saved ✓ " + new Date().toLocaleTimeString()); }
  } catch (err) { setStatus("Save failed: server down?", true); }
  saving = false;
}
async function load(name) {
  const r = await fetch(`/api/board?file=${encodeURIComponent(name)}`);
  if (!r.ok) { setStatus("Could not open " + name, true); return; }
  const j = await r.json();
  file = name; adopt(j);
  try { localStorage.setItem("board.file", name); } catch {}
  history.replaceState(null, "", "?file=" + encodeURIComponent(name));
  docEditing = false;
  render(); setStatus("Loaded " + name);
  // The board buttons list boards only; while a plan doc is open the board you came from stays lit.
  showBoardButtons(isDocFile() ? lastBoard : name);
  pollPickups().catch(() => {});  // know at once whether tiles are picked up here, not at the next poll
}
async function listFiles(select) {
  const j = await (await fetch("/api/files")).json();
  if (j.key) setKey(j.key);
  STORE_NAME = j.name || "";
  STORE_MODEL = j.model || "opus";
  STORE_REPOS = j.repos || [];
  STORE_SESSIONS = j.sessions || 2;
  STORE_TRUNK = j.trunk || "main";
  STORE_ATTACH = j.attach || "kandalf attach {id}";
  AGENT = j.agent || "Claude";
  if (j.models) MODELS = j.models;
  STORE_PICKUP_COLUMN = j.pickupColumn || "";
  $("#storeName").textContent = STORE_NAME;
  $("#fileSel").innerHTML = j.files.map(f => `<button type="button" role="tab" data-file="${esc(f)}" title="${esc(f)}">${esc(boardLabel(f))}</button>`).join("");
  $("#fileSel").title = j.dir;
  let pick = select || new URLSearchParams(location.search).get("file");
  if (!pick) try { pick = localStorage.getItem("board.file"); } catch {}
  // A plan doc isn't in the picker, but a tab opened from its link loads it from the URL.
  const isDocPath = /^(active|archive)\/[\w.-]+\.md$/.test(pick || "") && pick !== "archive/archived.md";
  if (!j.files.includes(pick) && !isDocPath) pick = j.files.includes("plans.md") ? "plans.md" : j.files[0];
  if (pick) await load(pick); else setStatus("No boards in this folder", true);
}
// Switching files saves pending changes to the current one first.
async function openFile(name) { if (dirty) await save(); return load(name); }
// A board's button reads as its name: plans.md → Plans, archive/archived.md → Archive.
const BOARD_LABELS = { "plans.md": "Plans", "backlog.md": "Backlog", [ARCHIVE_LOG]: "Archive" };
const boardLabel = f => BOARD_LABELS[f] || f.replace(/^.*\//, "").replace(/\.md$/, "").replace(/[-_]+/g, " ").replace(/^./, ch => ch.toUpperCase());
function showBoardButtons(on) {
  for (const b of $("#fileSel").querySelectorAll("button")) { b.classList.toggle("on", b.dataset.file === on); b.setAttribute("aria-selected", b.dataset.file === on); }
}
$("#fileSel").addEventListener("click", e => { const b = e.target.closest("button[data-file]"); if (b && b.dataset.file !== file) openFile(b.dataset.file); });
$("#search").addEventListener("input", () => doc && render());
// A count on the stats strip narrows the board to its tiles; a second click shows them all again.
$("#stats").addEventListener("click", e => {
  const b = e.target.closest("button[data-stat]");
  if (!b || !doc) return;
  statFilter = statFilter === b.dataset.stat ? "" : b.dataset.stat;
  render();
});
$("#colSort").value = colSort;
$("#colSort").addEventListener("change", e => {
  colSort = e.target.value;
  try { localStorage.setItem("board.colSort", colSort); } catch {}
  doc && render();
});
// The Theme menu and the chosen theme's accent swatches (BOARD_THEMES and applyTheme are in the head).
function showThemePick() {
  const offered = BOARD_THEMES[themeNow].accents;
  $("#themeSel").value = themeNow;
  $("#accentSel").hidden = offered.length < 2;
  $("#accentSel").innerHTML = offered.map(([c, name]) =>
    `<button type="button" data-accent="${c}" style="--swatch: ${c}" title="${name} accent" aria-label="${name} accent" aria-pressed="${c === accentNow}"></button>`).join("");
}
function setTheme(theme, accent) {
  themeNow = theme; accentNow = accent;
  try { localStorage.setItem("board.theme", theme); localStorage.setItem("board.accent." + theme, accent); } catch {}
  applyTheme(theme, accent); showThemePick();
}
$("#themeSel").innerHTML = Object.entries(BOARD_THEMES).map(([id, t]) => `<option value="${id}">${t.name}</option>`).join("");
$("#themeSel").addEventListener("change", e => setTheme(e.target.value, storedAccent(e.target.value)));
$("#accentSel").addEventListener("click", e => { const b = e.target.closest("button[data-accent]"); if (b) setTheme(themeNow, b.dataset.accent); });
showThemePick();

// Pick up edits made elsewhere (an editor, another Claude session) while idle.
setInterval(async () => {
  if (!file || dirty || saving || dragging || editing || docEditing || askDlg.open || document.hidden) return;
  try {
    const j = await (await fetch(`/api/board?file=${encodeURIComponent(file)}`)).json();
    if (j.mtime !== mtime && !dirty && !dragging && !editing && !askDlg.open) { adopt(j); render(); setStatus("Updated from disk " + new Date().toLocaleTimeString()); }
  } catch {}
}, 3000);
// Pickups change without the board file changing, so they are polled on their own.
const toldPickups = new Set(), askedPickups = new Set();
let pickupsLoaded = false;
const pickupId = job => `${job.key}@${job.at}`;
async function postPickup(body, failed = `${AGENT} wasn't started`) {
  const r = await fetch("/api/pickup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.jobs) { pickups = { enabled: j.enabled, why: j.why ?? null, jobs: j.jobs }; render(); }
  return r.ok ? j : (flash(`${failed}: ` + (j.error || r.status)), null);
}
const startPickup = key => postPickup({ key });
// Restart: resume the tile's session, or have a new one take over if it can't be resumed.
async function restartPickup(key) {
  setStatus(`Restarting ${AGENT} on ${key}…`);
  const j = await postPickup({ key, restart: true }).catch(() => (flash("Restart failed: server down?"), null));
  const job = j && pickupFor(key);
  if (job?.state === "started") flash(`${AGENT} is back on ${key}. Open it with: ${attachCmd(job.id)}`);
  else if (job?.state === "failed") flash(`${AGENT} couldn't be restarted on ${key}: ${job.error}`);
  setStatus(j ? "Restarted " + key : "Not restarted", !j);
}
// What a reply box holds: the text typed and the steps ticked.
function replyOf(form) {
  return { text: form.querySelector("textarea").value, steps: [...form.querySelectorAll("input[data-step]:checked")].map(b => b.dataset.step) };
}
// The reply box's Send: what was typed, and the steps ticked, go into the same conversation.
async function sendReply(form) {
  const key = form.dataset.key, reply = replyOf(form), text = reply.text.trim(), steps = reply.steps;
  if (!text && !steps.length) return flash(`Type a reply to send to ${AGENT}, or tick what to do.`);
  setStatus(`Sending to ${AGENT} on ${key}…`);
  const j = await postPickup({ key, reply: text, steps }, "Not sent").catch(() => (flash("Not sent: server down?"), null));
  if (j) { delete replyDrafts[key]; replyOpen.delete(key); render(); if (dlg.open && dlg.dataset.mode === "view") setCardMode("view"); flash(`Sent to ${AGENT} on ${key}` + (steps.length ? ` (${steps.join(", ")})` : "") + "."); }
  setStatus(j ? "Sent to " + key : "Not sent", !j);
}
// The reply box keeps its draft as it is typed and ticked, ⌘↵ or Ctrl+↵ sends, and a tile isn't
// dragged from inside it (so text can be selected).
document.addEventListener("input", e => {
  const form = e.target.closest?.(".session-reply");
  if (!form) return;
  replyDrafts[form.dataset.key] = replyOf(form);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.matches?.("textarea[data-reply]")) { e.preventDefault(); sendReply(e.target.closest(".session-reply")); }
});
boardEl.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if (card) card.draggable = !e.target.closest(".session-reply");
});
// Queue: a paused story waits its turn again.
async function queuePickup(key) {
  const j = await postPickup({ key, queue: true }, "Not queued").catch(() => (flash("Not queued: server down?"), null));
  if (j) flash(`${key} is queued: a new ${AGENT} session takes it over in its turn. Start now doesn't wait.`);
  setStatus(j ? "Queued " + key : "Not queued", !j);
}
// Pause: the session writes its handoff and stops; the story waits in In flight for Continue.
async function pausePickup(key) {
  setStatus(`Pausing ${AGENT} on ${key}…`);
  const j = await postPickup({ key, pause: true }).catch(() => (flash("Pause failed: server down?"), null));
  const job = j && pickupFor(key);
  if (job?.pausing) flash(`${AGENT} is writing its handoff on ${key}, then stops. Continue picks it up again.`);
  else if (job?.state === "paused") flash(`${key} is paused. Continue has a new session take it over.`);
  setStatus(j ? "Paused " + key : "Not paused", !j);
}
// Continue: get a stopped session going again: resume it told to carry on, or for a paused
// story have a new one take over from its handoff.
async function continuePickup(key) {
  setStatus(`Waking ${AGENT} on ${key}…`);
  const j = await postPickup({ key, continue: true }).catch(() => (flash("Continue failed: server down?"), null));
  const job = j && pickupFor(key);
  if (job?.state === "started") flash(`${AGENT} is carrying on with ${key}. Open it with: ${attachCmd(job.id)}`);
  else if (job?.state === "failed") flash(`${AGENT} couldn't be woken on ${key}: ${job.error}`);
  setStatus(j ? "Continued " + key : "Not continued", !j);
}
// The Status button: the server checks the story's session and branch now and writes what it
// finds under the tile's session line. An opened tile stays open and shows it under the session block.
async function refreshStatus(key) {
  const wasOpen = dlg.open;
  if (wasOpen && $("#cardText").value !== editing?.original && !await ask({ title: "Refresh the status?", body: "Your changes to this tile aren't saved, and the refresh drops them.", ok: "Refresh", danger: true })) return;
  if (dirty) await save();
  setStatus(`Checking ${key}…`);
  // The button spins while the check runs: the ones drawn now, and (statusBusy) the ones the
  // board draws meanwhile. The redraw that ends the check, and refilling the tile below, draw fresh ones.
  const spin = on => document.querySelectorAll(`[data-act=status][data-key="${key}"]`).forEach(b => { b.classList.toggle("busy", on); b.disabled = on; });
  statusBusy.add(key); spin(true);
  const j = await postPickup({ key, status: true }).catch(() => (flash("Status check failed: server down?"), null));
  statusBusy.delete(key);
  if (j) await reloadQuiet();
  spin(false);
  if (!j) return setStatus("Not checked", true);
  setStatus("Status of " + key + " refreshed");
  // Pressed on the board, the status is told in a toast. An open tile shows it itself: it
  // stays open and is refilled where it is, so the dialog doesn't blink.
  if (!wasOpen || !dlg.open) return flash(statusToast(j.status), `${key} status`);
  const f = findCardByKey(key);
  if (!f) return dlg.close("cancel");
  // The view keeps its scroll and its log pane's; the editor keeps its caret and scroll, where
  // setCardMode would send the caret to the end.
  const ta = $("#cardText"), caret = [ta.selectionStart, ta.selectionEnd], top = ta.scrollTop, back = scrollPlaces($("#cardView"));
  editing = { card: f.c, sec: f.s };
  fillCard([f.c.text, ...trimBlank(f.c.body)].join("\n"));
  setCardMode(dlg.dataset.mode);
  back();
  if (dlg.dataset.mode === "edit") { ta.setSelectionRange(...caret); ta.scrollTop = top; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); flash(`Copied: ${text}`); }
  catch { flash(`Copy it from here: ${text}`); }
}
// One session at a time unless you say otherwise. unasked: the board is offering, not a click
// on the tile's badge; a master's sub-stories queue by its session limit, so they aren't offered.
async function offerPickup(job, unasked = false) {
  if (!job || job.state !== "waiting" || (unasked && job.master) || askDlg.open) return;
  const ahead = job.behind || "another tile";
  if (await ask({ title: `Start ${job.key} now?`, ok: "Start in parallel", cancel: "Leave it queued",
    body: [`<b>${esc(job.key)}</b> ${esc(job.title)}`, `It is in flight, but ${AGENT} is still working on ${esc(ahead)}.`],
    note: `Queued, it starts when the session on ${esc(ahead)} ends.` })) startPickup(job.key);
}
async function pollPickups() {
  if (file !== PICKUP_BOARD || document.hidden) return;
  const next = await (await fetch("/api/pickup")).json();
  const changed = JSON.stringify(next) !== JSON.stringify(pickups), first = !pickupsLoaded;
  pickups = next; pickupsLoaded = true;
  for (const job of pickups.jobs) {
    if (toldPickups.has(pickupId(job) + job.state + (job.waiting || "") + (job.ready ? "ready" : ""))) continue;
    toldPickups.add(pickupId(job) + job.state + (job.waiting || "") + (job.ready ? "ready" : ""));
    if (first) continue;  // what happened before this page opened isn't news
    if (job.state === "started") flash(`${AGENT} picked up ${job.key}. Open it with: ${attachCmd(job.id)}`);
    if (job.state === "failed") flash(`${AGENT} couldn't be started for ${job.key}: ${job.error}`);
    if (job.state === "lost") flash(`The ${AGENT} session on ${job.key} is gone. Continue is on its tile.`);
    if (job.ready) flash(`${job.key} is ready for review: its tile is outlined in green.`);
    else if (job.state === "idle" && job.waiting) flash(`${AGENT} is waiting for your input on ${job.key}: ${WAITING[job.waiting]}. Open it with: ${attachCmd(job.id)}`);
  }
  if (dragging || editing) return;
  if (changed) render();
  for (const job of pickups.jobs) {
    if (job.state !== "waiting" || !job.behind || askedPickups.has(pickupId(job))) continue;
    askedPickups.add(pickupId(job));
    offerPickup(job, true);
  }
}
setInterval(() => pollPickups().catch(() => {}), 3000);
setInterval(() => { if (!document.hidden) refreshLogs().catch(() => {}); }, 3000);
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); } });

listFiles();
</script>
